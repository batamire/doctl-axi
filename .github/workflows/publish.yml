name: publish

# NOTE: `release` alone doesn't work here — release-please creates the GitHub
# Release with GITHUB_TOKEN, whose events never trigger other workflows.
# workflow_run (release-please completion) is not subject to that restriction,
# so it does the real work; the release trigger stays as a fallback for
# manual releases.
on:
  release:
    types: [released]
  workflow_run:
    workflows: [release-please]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint OIDC token for npm trusted publishing
    steps:
      - name: Resolve release tag / skip-if-published
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "doctl-axi@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # TEMP DEBUG: decode OIDC claims to verify Trusted Publisher match
      - name: Debug OIDC claims
        if: steps.tag.outputs.skip != 'true'
        run: |
          RESP=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          echo "$RESP" | jq -r .value | python3 -c \
            "import sys,base64,json;p=sys.stdin.read().strip().split('.')[1];p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
      - uses: actions/checkout@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          ref: refs/tags/v${{ steps.tag.outputs.version }}
      - uses: pnpm/action-setup@v4
        if: steps.tag.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version: 24 # ships npm 11.x, required for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: steps.tag.outputs.skip != 'true'
      - run: pnpm build
        if: steps.tag.outputs.skip != 'true'
      - run: npm publish --provenance --access public
        if: steps.tag.outputs.skip != 'true'
